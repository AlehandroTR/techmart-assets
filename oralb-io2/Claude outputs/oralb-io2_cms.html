<div class="oio2">
<style>
/* НАСТРОЙКИ */
.oio2{--oio2-gap:0px;--oio2-slide:5s;--oio2-bg:#0b3d91;--oio2-radius:0px;--oio2-rise:48px}
/* ОСНОВА */
.oio2{max-width:1464px;margin:0 auto;font-family:inherit;line-height:0}
.oio2 .s{position:relative;overflow:hidden;aspect-ratio:61/25;background:var(--oio2-bg);margin:0 0 var(--oio2-gap);border-radius:var(--oio2-radius)}
.oio2 .s img{display:block;width:100%;height:100%;object-fit:cover;max-width:none;border:0}
/* 01 HERO */
.oio2 .hero img{animation:oio2-kb 9s cubic-bezier(.2,.6,.2,1) both;transform-origin:20% 40%}
.oio2 .hero .shine{position:absolute;top:0;left:-60%;width:40%;height:100%;font-size:0;line-height:0;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.28) 50%,rgba(255,255,255,0) 100%);transform:skewX(-18deg);animation:oio2-shine 6s ease-in-out 1.2s infinite}
@keyframes oio2-kb{from{transform:scale(1.09)}to{transform:scale(1)}}
@keyframes oio2-shine{0%{left:-60%}30%{left:130%}100%{left:130%}}
/* ПОЯВА ПРИ СКРОЛ (Chrome, Edge, Safari 26+; другаде секциите са просто видими) */
@supports (animation-timeline:view()){
.oio2 .rv{animation:oio2-up linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
.oio2 .rv img{animation:oio2-zoom linear both;animation-timeline:view();animation-range:entry 0% cover 50%}
}
@keyframes oio2-up{from{opacity:0;transform:translateY(var(--oio2-rise)) scale(.97)}to{opacity:1;transform:none}}
@keyframes oio2-zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
/* 06-09 СЛАЙДЕР */
.oio2 .car .sl{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;animation:oio2-fade calc(var(--oio2-slide)*4) linear infinite}
.oio2 .car .sl img{animation:oio2-drift calc(var(--oio2-slide)*4) linear infinite}
.oio2 .car .sl1,.oio2 .car .sl1 img{animation-delay:calc(var(--oio2-slide)*-0.2)}
.oio2 .car .sl2,.oio2 .car .sl2 img{animation-delay:calc(var(--oio2-slide)*0.8)}
.oio2 .car .sl3,.oio2 .car .sl3 img{animation-delay:calc(var(--oio2-slide)*1.8)}
.oio2 .car .sl4,.oio2 .car .sl4 img{animation-delay:calc(var(--oio2-slide)*2.8)}
@keyframes oio2-fade{0%{opacity:0}3%{opacity:1}25%{opacity:1}28%{opacity:0}100%{opacity:0}}
@keyframes oio2-drift{0%{transform:scale(1.06)}28%{transform:scale(1)}100%{transform:scale(1)}}
.oio2 .dots{position:absolute;left:0;right:0;bottom:3%;text-align:center;line-height:0;z-index:3}
.oio2 .dots .dot{display:inline-block;width:10px;height:10px;margin:0 5px;border-radius:10px;font-size:0;line-height:0;background:rgba(255,255,255,.45);animation:oio2-dot calc(var(--oio2-slide)*4) linear infinite}
.oio2 .dots .d1{animation-delay:calc(var(--oio2-slide)*-0.2)}
.oio2 .dots .d2{animation-delay:calc(var(--oio2-slide)*0.8)}
.oio2 .dots .d3{animation-delay:calc(var(--oio2-slide)*1.8)}
.oio2 .dots .d4{animation-delay:calc(var(--oio2-slide)*2.8)}
@keyframes oio2-dot{0%{width:10px;background:rgba(255,255,255,.45)}3%{width:30px;background:#fff}25%{width:30px;background:#fff}28%{width:10px;background:rgba(255,255,255,.45)}100%{width:10px;background:rgba(255,255,255,.45)}}
.oio2 .car:hover .sl,.oio2 .car:hover .sl img,.oio2 .car:hover .dot{animation-play-state:paused}
/* БЕЗ АНИМАЦИИ при намалено движение */
@media (prefers-reduced-motion:reduce){
.oio2 .hero img,.oio2 .hero .shine,.oio2 .rv,.oio2 .rv img,.oio2 .car .sl,.oio2 .car .sl img,.oio2 .dots .dot{animation:none}
.oio2 .hero .shine{display:none}
.oio2 .car .sl1{opacity:1}
.oio2 .dots{display:none}
}
</style>

<div class="sl sl2"><!-- 07 --><img class="" src="https://raw.githubusercontent.com/AlehandroTR/techmart-assets/main/oralb-io2/07.jpg" alt="07 Стоматолозите препоръчват смяна на накрайника на всеки 3 месеца" width="1464" height="600" loading="lazy" referrerpolicy="no-referrer" /></div>
<div class="sl sl3"><!-- 08 --><img class="" src="https://raw.githubusercontent.com/AlehandroTR/techmart-assets/main/oralb-io2/08.jpg" alt="08 Вашата перфектна чистота започва с Oral-B: серията iO" width="1464" height="600" loading="lazy" referrerpolicy="no-referrer" /></div>
<div class="sl sl4"><!-- 09 --><img class="" src="https://raw.githubusercontent.com/AlehandroTR/techmart-assets/main/oralb-io2/09.jpg" alt="09 Избери подходящата iO за теб: iO2, iO3, iO5, iO6, iO9, iO10" width="1464" height="600" loading="lazy" referrerpolicy="no-referrer" /></div>
<div class="dots"><b class="dot d1">&nbsp;</b><b class="dot d2">&nbsp;</b><b class="dot d3">&nbsp;</b><b class="dot d4">&nbsp;</b></div>
</div>
<div class="s rv"><!-- 10 --><img class="" src="https://raw.githubusercontent.com/AlehandroTR/techmart-assets/main/oralb-io2/10.jpg" alt="10 Сравнение на моделите Oral-B iO2, iO3, iO5, iO6, iO9 и iO10" width="1464" height="600" loading="lazy" referrerpolicy="no-referrer" /></div>
